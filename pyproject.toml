[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rabbit-sim"
description = "Single-binary, in-memory AMQP 0-9-1 broker (RabbitMQ-compatible) for local development, with optional SQLite persistence and a tiny web UI"
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ville Vainio", email = "vivainio@gmail.com" }]
keywords = ["rabbitmq", "amqp", "broker", "testing", "simulator", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/vivainio/rabbit-sim"
Repository = "https://github.com/vivainio/rabbit-sim"

[tool.maturin]
bindings = "bin"
